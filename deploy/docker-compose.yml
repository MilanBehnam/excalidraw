# Self-hosted Excalidraw with live collaboration and shared collections.
# See deploy/README.md. On the server, deploy/update.sh runs it.
services:
  # images are built by GitHub Actions (.github/workflows/deploy-images.yml)
  app:
    image: ${IMAGES:-ghcr.io/milanbehnam/excalidraw}-app:${IMAGE_TAG:-latest}
    restart: unless-stopped

  backend:
    image: ${IMAGES:-ghcr.io/milanbehnam/excalidraw}-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # credentials come from the EC2 instance role (deploy/aws.yml)
      AWS_REGION: ${AWS_REGION:?set AWS_REGION, e.g. us-east-1}
      TABLE_NAME: ${TABLE_NAME:?set TABLE_NAME from the stack outputs}
      BUCKET_NAME: ${BUCKET_NAME:?set BUCKET_NAME from the stack outputs}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:?set from the stack outputs}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:?set from the stack outputs}
      # the site on GitHub Pages calls the backend cross-origin
      CORS_ORIGIN: ${CORS_ORIGIN:-}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to your domain, e.g. draw.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  caddy_data:
