# Everything for a self-hosted Excalidraw with collaboration, in one stack:
# DynamoDB table + S3 bucket (encrypted drawings), and an EC2 instance that
# clones this repo and runs deploy/docker-compose.yml (app, backend, Caddy).
#
# Deployed with the CloudFormation service role from bootstrap.yml, whose
# permissions are scoped to these fixed names and the Project=excalidraw tag:
#
#   aws cloudformation deploy --template-file deploy/aws.yml \
#     --stack-name excalidraw --capabilities CAPABILITY_NAMED_IAM \
#     --role-arn arn:aws:iam::<account id>:role/excalidraw-cloudformation \
#     --parameter-overrides Passcode=<pick one>
AWSTemplateFormatVersion: "2010-09-09"
Description: Excalidraw with live collaboration and shared collections

Parameters:
  Passcode:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Needed to create collections and standalone rooms
  RepoUrl:
    Type: String
    Default: https://github.com/MilanBehnam/excalidraw.git
  Branch:
    Type: String
    Default: master
  Domain:
    Type: String
    Default: ""
    Description: Optional, e.g. draw.example.com (A record → the stack's IP). Empty = <ip>.sslip.io
  InstanceType:
    Type: String
    Default: t3.small
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

Conditions:
  HasDomain: !Not [!Equals [!Ref Domain, ""]]

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: excalidraw
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - { Key: Project, Value: excalidraw }

  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub excalidraw-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - { Key: Project, Value: excalidraw }

  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: excalidraw-backend
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # shell access from the console (Session Manager), no SSH needed
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: excalidraw-backend
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${Bucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
      Tags:
        - { Key: Project, Value: excalidraw }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: excalidraw-backend
      Roles: [!Ref Role]

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Excalidraw web (HTTP for the certificate challenge + HTTPS)
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
      Tags:
        - { Key: Project, Value: excalidraw }

  IP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - { Key: Project, Value: excalidraw }

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - { Key: Project, Value: excalidraw }
      LaunchTemplateData:
        # the instance's disk and network interface
        TagSpecifications:
          - ResourceType: volume
            Tags:
              - { Key: Project, Value: excalidraw }
          - ResourceType: network-interface
            Tags:
              - { Key: Project, Value: excalidraw }
        MetadataOptions:
          HttpTokens: required
          # containers are one network hop further away than the host
          HttpPutResponseHopLimit: 2
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs: { VolumeSize: 20, VolumeType: gp3 }

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt SecurityGroup.GroupId]
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      Tags:
        - { Key: Name, Value: !Ref AWS::StackName }
        - { Key: Project, Value: excalidraw }
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -euxo pipefail
            # the image build needs more than t3.small's 2 GB of RAM
            fallocate -l 4G /swapfile
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab

            curl -fsSL https://get.docker.com | sh
            git clone --branch ${Branch} ${RepoUrl} /opt/excalidraw
            cd /opt/excalidraw
            cat > deploy/.env <<'EOF'
            DOMAIN=${SiteDomain}
            AWS_REGION=${AWS::Region}
            TABLE_NAME=${Table}
            BUCKET_NAME=${Bucket}
            PASSCODE=${Passcode}
            EOF
            chmod 600 deploy/.env
            docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build

            # pushes to ${Branch} get deployed automatically
            echo '*/5 * * * * root flock -n /run/excalidraw-update.lock /opt/excalidraw/deploy/update.sh >> /var/log/excalidraw-update.log 2>&1' > /etc/cron.d/excalidraw-update
          - SiteDomain: !If [HasDomain, !Ref Domain, !Sub "${IP}.sslip.io"]

  # all Project=excalidraw resources in one place (Resource Groups console)
  ResourceGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name: excalidraw
      ResourceQuery:
        Type: TAG_FILTERS_1_0
        Query:
          ResourceTypeFilters: [AWS::AllSupported]
          TagFilters:
            - { Key: Project, Values: [excalidraw] }
      Tags:
        - { Key: Project, Value: excalidraw }

  IPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt IP.AllocationId
      InstanceId: !Ref Instance

Outputs:
  Url:
    Value:
      !If [HasDomain, !Sub "https://${Domain}", !Sub "https://${IP}.sslip.io"]
  InstanceId:
    Value: !Ref Instance
  TableName:
    Value: !Ref Table
  BucketName:
    Value: !Ref Bucket
