# Everything for a self-hosted Excalidraw with collaboration, in one stack:
# DynamoDB table + S3 bucket (encrypted drawings), and an EC2 instance that
# clones this repo and runs deploy/docker-compose.yml (app, backend, Caddy).
#
# Deployed with the CloudFormation service role from bootstrap.yml, whose
# permissions are scoped to these fixed names and the Project=excalidraw tag:
#
#   aws cloudformation deploy --template-file deploy/aws.yml \
#     --stack-name excalidraw --capabilities CAPABILITY_NAMED_IAM \
#     --role-arn arn:aws:iam::<account id>:role/excalidraw-cloudformation
AWSTemplateFormatVersion: "2010-09-09"
Description: Excalidraw with accounts, live collaboration, shared collections and version history

Parameters:
  RepoUrl:
    Type: String
    Default: https://github.com/MilanBehnam/excalidraw.git
  Branch:
    Type: String
    Default: master
  Domain:
    Type: String
    Default: ""
    Description: Optional, e.g. draw.example.com (A record → the stack's IP). Empty = <ip>.sslip.io
  InstanceType:
    Type: String
    Default: t3.small
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

Conditions:
  HasDomain: !Not [!Equals [!Ref Domain, ""]]

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: excalidraw
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # old versions are removed after 90 days (see backend/store.ts)
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - { Key: Project, Value: excalidraw }

  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub excalidraw-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            Prefix: versions/
            ExpirationInDays: 90
      Tags:
        - { Key: Project, Value: excalidraw }

  # accounts: sign-up with email + verification code, login, password reset.
  # The app talks to Cognito directly; the backend only checks its ID tokens.
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: excalidraw
      UserPoolTier: LITE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Schema:
        - Name: name
          AttributeDataType: String
          Required: true
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your Excalidraw code
        EmailMessage: "Your Excalidraw code is {####}"
      UserPoolTags:
        Project: excalidraw

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: excalidraw-web
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      RefreshTokenValidity: 30
      TokenValidityUnits:
        RefreshToken: days

  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: excalidraw-backend
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # shell access from the console (Session Manager), no SSH needed
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: excalidraw-backend
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:BatchGetItem
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${Bucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
      Tags:
        - { Key: Project, Value: excalidraw }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: excalidraw-backend
      Roles: [!Ref Role]

  # own network (accounts may have no default VPC)
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Project, Value: excalidraw }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Project, Value: excalidraw }

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - { Key: Project, Value: excalidraw }

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Project, Value: excalidraw }

  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet
      RouteTableId: !Ref RouteTable

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref Vpc
      GroupDescription: Excalidraw web (HTTP for the certificate challenge + HTTPS)
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
      Tags:
        - { Key: Project, Value: excalidraw }

  IP:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - { Key: Project, Value: excalidraw }

  # the fixed IP is attached before the instance boots, so its setup script
  # has internet access from the start
  NetworkInterface:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref Subnet
      GroupSet: [!GetAtt SecurityGroup.GroupId]
      Tags:
        - { Key: Project, Value: excalidraw }

  IPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt IP.AllocationId
      NetworkInterfaceId: !Ref NetworkInterface

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - { Key: Project, Value: excalidraw }
      LaunchTemplateData:
        # the instance's disk
        TagSpecifications:
          - ResourceType: volume
            Tags:
              - { Key: Project, Value: excalidraw }
        MetadataOptions:
          HttpTokens: required
          # containers are one network hop further away than the host
          HttpPutResponseHopLimit: 2
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs: { VolumeSize: 20, VolumeType: gp3 }

  Instance:
    Type: AWS::EC2::Instance
    DependsOn: [IPAssociation, SubnetRoutes, InternetRoute]
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      NetworkInterfaces:
        - DeviceIndex: "0"
          NetworkInterfaceId: !Ref NetworkInterface
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      Tags:
        - { Key: Name, Value: !Ref AWS::StackName }
        - { Key: Project, Value: excalidraw }
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -euxo pipefail
            # the image build needs more than t3.small's 2 GB of RAM
            fallocate -l 4G /swapfile
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab

            curl -fsSL https://get.docker.com | sh
            git clone --branch ${Branch} ${RepoUrl} /opt/excalidraw
            cd /opt/excalidraw
            cat > deploy/.env <<'EOF'
            DOMAIN=${SiteDomain}
            AWS_REGION=${AWS::Region}
            TABLE_NAME=${Table}
            BUCKET_NAME=${Bucket}
            COGNITO_USER_POOL_ID=${UserPool}
            COGNITO_CLIENT_ID=${UserPoolClient}
            EOF
            chmod 600 deploy/.env
            # before the first build, so a failed build is retried by the next push
            echo '*/5 * * * * root flock -n /run/excalidraw-update.lock /opt/excalidraw/deploy/update.sh >> /var/log/excalidraw-update.log 2>&1' > /etc/cron.d/excalidraw-update
            docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build

          - SiteDomain: !If [HasDomain, !Ref Domain, !Sub "${IP}.sslip.io"]

  # all Project=excalidraw resources in one place (Resource Groups console)
  ResourceGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name: excalidraw
      ResourceQuery:
        Type: TAG_FILTERS_1_0
        Query:
          ResourceTypeFilters: [AWS::AllSupported]
          TagFilters:
            - { Key: Project, Values: [excalidraw] }
      Tags:
        - { Key: Project, Value: excalidraw }

  # AWS-hosted address (https://<id>.cloudfront.net) in front of the server,
  # for networks whose firewall blocks sslip.io. Nothing is cached: every
  # request, incl. the live-collaboration WebSocket, goes to the server.
  Cdn:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        PriceClass: PriceClass_100
        HttpVersion: http2
        Origins:
          - Id: server
            DomainName: !If [HasDomain, !Ref Domain, !Sub "${IP}.sslip.io"]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: server
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          Compress: true
          # managed policies: CachingDisabled, AllViewerExceptHostHeader
          # (the server's HTTPS site answers to its own host name)
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
      Tags:
        - { Key: Project, Value: excalidraw }

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CdnUrl:
    Value: !Sub "https://${Cdn.DomainName}"
  Url:
    Value:
      !If [HasDomain, !Sub "https://${Domain}", !Sub "https://${IP}.sslip.io"]
  InstanceId:
    Value: !Ref Instance
  TableName:
    Value: !Ref Table
  BucketName:
    Value: !Ref Bucket
